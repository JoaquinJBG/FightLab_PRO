<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entreno en curso</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fl.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Geist:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="ph {{tema}}">
<div class="fx quiet"></div>
<div class="scr" style="gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<a class="link small" href="#" style="display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--muted)"><i class="ic i-left s18"></i>Entreno</a>
<div style="display: flex; align-items: center; gap: 8px">
<span class="chip on"><i class="ic i-timer s16"></i>Descanso 87 s</span>
<button class="icobtn sm" type="button" aria-label="Ajustes del entreno"><i class="ic i-sliders s18"></i></button>
</div>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
<h1 class="d t-h1">Full body A</h1>
<span class="stat neon" style="font-size: 22px">42:10</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span class="bar" style="flex: 1"><i style="width: 30%"></i></span>
<span class="cap muted">2 de 6</span>
</div>
<section class="glass" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<span class="check on"><i class="ic i-check s16"></i></span>
<span style="flex: 1; font-weight: 500">Sentadilla</span>
<span class="cap muted">4 × 6 · 100 kg</span>
</section>
<section class="glass edge" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span class="num not-cur">02</span>
<h2 class="d t-h3" style="font-size: 20px; flex: 1">Press banca</h2>
<span class="chip rec"><i class="ic i-sparkles s16"></i>Récord</span>
</div>
<div class="sets">
<span class="hd">Serie</span><span class="hd">kg</span><span class="hd">reps</span><span class="hd">RIR</span><span class="hd"></span>
<span class="setno">1</span><input class="cell" value="80" aria-label="kg, serie 1"><input class="cell" value="8" aria-label="repeticiones, serie 1"><input class="cell" value="2" aria-label="RIR, serie 1"><button class="check on" type="button" aria-label="Serie 1 hecha"><i class="ic i-check s16"></i></button>
<span class="setno">2</span><input class="cell" value="82,5" aria-label="kg, serie 2"><input class="cell" value="8" aria-label="repeticiones, serie 2"><input class="cell" value="1" aria-label="RIR, serie 2"><button class="check on" type="button" aria-label="Serie 2 hecha"><i class="ic i-check s16"></i></button>
<span class="setno">3</span><input class="cell focus" value="82,5" aria-label="kg, serie 3"><input class="cell" value="" placeholder="8" aria-label="repeticiones, serie 3"><input class="cell" value="" placeholder="1" aria-label="RIR, serie 3"><button class="check" type="button" aria-label="Marcar serie 3"><i class="ic i-check s16"></i></button>
</div>
</section>
<section class="glass" style="display: flex; flex-direction: column; padding: 4px 16px">
<div class="exrow"><span class="num not-cur">03</span><span style="flex: 1">Peso muerto rumano</span><span class="cap muted">3 × 8 · 90 kg</span></div>
<div class="exrow"><span class="num not-cur">04</span><span style="flex: 1">Remo con barra</span><span class="cap muted">3 × 10 · 60 kg</span></div>
<div class="exrow"><span class="num not-cur">05</span><span style="flex: 1">Press militar</span><span class="cap muted">3 × 8 · 45 kg</span></div>
<div class="exrow"><span class="num not-cur">06</span><span style="flex: 1">Plancha</span><span class="cap muted">2 × 45 s</span></div>
</section>
<button class="btn block" type="button">Terminar entreno</button>
</div>
<nav class="tabbar" aria-label="Secciones">
<a href="#"><span class="pill"><i class="ic i-house"></i></span>Hoy</a>
<a href="#" aria-current="page"><span class="pill"><i class="ic i-dumbbell"></i></span>Entreno</a>
<a href="#"><span class="pill"><i class="ic i-utensils"></i></span>Nutrición</a>
<a href="#"><span class="pill"><i class="ic i-chart"></i></span>Progreso</a>
<a href="#"><span class="pill"><i class="ic i-message"></i></span>Coach</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["cur","A","B","A light","B light"],"default":"cur"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { tema: this.props.tema ?? 'cur' };
}
}
</script>
</body>
</html>
