<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrada</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fl.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Geist:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="ph {{tema}}">
<div class="fx"></div>
<div class="scr" style="padding: 52px 24px 40px; justify-content: center; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div class="only-cur" style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<div class="fl-tile">FL</div>
<h1 style="font: 700 30px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: -.03em">FIGHTLAB <span class="neon">PRO</span></h1>
</div>
<div class="only-A logo franja" style="width: 330px; height: 132px; font-size: 58px">
<span class="lt lg">fightlab</span>
<span class="franja__banda"><span class="clip"><span class="lt lg">fightlab</span></span></span>
</div>
<div class="only-B" style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div class="logo franja" style="width: 330px; height: 132px; font-size: 52px">
<span class="lt lg w">FIGHTLAB</span>
<span class="franja__banda"><span class="clip"><span class="lt lg">FIGHTLAB</span></span></span>
</div>
<p style="display: flex; align-items: center; gap: 10px"><span class="chip on" style="font-weight: 700; letter-spacing: .12em">PRO</span><span class="cap muted">by joaquín beltrán</span></p>
</div>
<p class="muted">Rendimiento de combate, medido y entrenado.</p>
</div>
<form class="glass flat-cur" style="display: flex; flex-direction: column; gap: 12px; padding: 20px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Email</span>
<input class="field" type="email" placeholder="tu@email.com">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Contraseña</span>
<input class="field focus" type="password" value="contrasena" aria-describedby="olvido">
</label>
<a id="olvido" class="link small" href="#" style="align-self: flex-end">¿Olvidaste tu contraseña?</a>
<button class="btn block" type="button" style="margin-top: 4px">Entrar<i class="ic i-arrow s18"></i></button>
</form>
<p class="small muted" style="text-align: center">¿No tienes cuenta? <a class="link" href="#">Crear cuenta</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["cur","A","B","A light","B light"],"default":"cur"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { tema: this.props.tema ?? 'cur' };
}
}
</script>
</body>
</html>
