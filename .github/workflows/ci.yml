name: CI

on:
  push:
    branches: [main, staging, feat/beta-cloud]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fightlab
          POSTGRES_PASSWORD: fightlab
          POSTGRES_DB: fightlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fightlab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Sin .env, sin secretos: todo es de mentira.
      ENV_FILE: /nonexistent
      DEBUG: "True"
      DATABASE_URL: postgres://fightlab:fightlab@127.0.0.1:5432/fightlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q
      - name: makemigrations drift
        run: python manage.py makemigrations --check --dry-run
      - name: check --deploy (prod dummy env)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          SECRET_KEY: ci-dummy-Zq8Lw3Rt7Yp2Nm5Kd9Vh4Xc6Bj1Fg0Sa-not-a-real-secret
          BFF_SHARED_SECRET: ci-dummy
          ALLOWED_HOSTS: api.example.test
          ADMIN_URL: secret-admin/
          EMAIL_PROVIDER: console
          FRONTEND_URL: https://app.example.test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build backend image
        run: docker build backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      DJANGO_API_URL: http://127.0.0.1:8001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: tsc
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: next build
        run: pnpm build
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke (mobile 320/360/390)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
