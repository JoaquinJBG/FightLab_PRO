# FightLab convention: default supermarket sections for the shopping list.
#
# Part of FightLab's evidence annex, but not evidence: a word list that puts a shopping-list line in
# a supermarket section when neither the menu nor the user's chain catalogue gives one. The coach's
# engine has no food categories. Matching is by whole words, case and accents ignored, singular or
# plural (coach.tastes.matches), against the food's name in Spanish and English; the first section
# that matches wins, so the order matters (for example "leche de coco" must reach Conservas before
# Lácteos reads "leche"). It is not complete: a food it does not name goes to "Otros". Review or
# extend it here; the logic in coaching/shopping.py does not change. This content belongs to
# FightLab and is licensed CC BY 4.0. Checked on 2026-11-09.

label: FightLab convention
checked_on: 2026-11-09
other: {es: Otros, en: Other}
