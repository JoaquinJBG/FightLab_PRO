<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono de FightLab Pro: «FL», como el logo de la entrada y del alta (F16). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35e6ff"/>
      <stop offset="1" stop-color="#2b6bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05070e"/>
  <g filter="url(#glow)" stroke="url(#g)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M128 148 V364"/>
    <path d="M128 148 H240"/>
    <path d="M128 252 H222"/>
    <path d="M300 148 V364 H396"/>
  </g>
</svg>
