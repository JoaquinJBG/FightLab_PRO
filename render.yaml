# Blueprint de Render para el backend de FightLab Pro.
# https://render.com/docs/blueprint-spec
#
# El frontend (Next.js) no va aquí: se despliega en Vercel.
services:
  - type: web
    name: fightlab-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: NUM_PROXIES
        # Solo se usa como fallback (sin BFF_SHARED_SECRET, o si alguien
        # llama directo a *.onrender.com sin pasar por el BFF de Vercel):
        # en ese camino hay UN único proxy de confianza (el borde de
        # Render). Con 2 aquí, cualquiera podría saltarse el throttle de
        # login/register/reset inventándose X-Forwarded-For.
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: BETA_ALLOWED_EMAILS
        sync: false
      # Secreto compartido con el BFF de Next (mismo valor en Vercel): sin
      # él, el throttle de auth no distingue visitantes detrás del BFF.
      - key: BFF_SHARED_SECRET
        sync: false
      # Render free bloquea el SMTP saliente (25/465/587): el envío va por
      # la API HTTP de Brevo vía django-anymail. 'resend' es la alternativa
      # si se cambia de proveedor (RESEND_API_KEY, sync:false, opcional).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_CHAT
        value: claude-sonnet-5
      - key: AI_MODEL_VISION
        value: claude-sonnet-5
      - key: DJANGO_LOG_LEVEL
        value: INFO
